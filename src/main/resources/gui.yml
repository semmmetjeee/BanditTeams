# %online% and %last_seen% can be used in members.member.lore.
# %last_seen% uses the format: 22 Aug. 2026. Supports & and &#RRGGBB colors.
last-seen-output:
  # Used for %last_seen% while the player is online.
  online: "&#55E36A&lNow"
  never: "&7Never"

status-output:
  online: "&#55E36A&lONLINE"
  offline: "&#FF5C6C&lOFFLINE"

shared:
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  navigation:
    previous:
      slot: 48
      material: ARROW
      name: "&#d9a441← Previous Page"
    page:
      slot: 49
      material: PAPER
      name: "&fPage &#d9a441%page%&f/&#d9a441%pages%"
    next:
      slot: 50
      material: ARROW
      name: "&#d9a441Next Page →"

members:
  title: "&#d9a441&l%team% MEMBERS"
  member:
    name: "&#d9a441%player%"
    lore:
      - "&7Role: %role%"
      - "&7Last seen: &f%last_seen%"

teams:
  title: "&#d9a441&lALL CREWS"
  team:
    name: "&#d9a441[%team%]"
    lore:
      - "&7Leader: &#d9a441%leader%"
      - "&7Members: &#d9a441%members%&7/&f%max_members%"
      - ""
      - "%join_status%"
  create:
    slot: 46
    material: EMERALD
    name: "&#67e86b&lCREATE A CREW"
    lore:
      - "&7Click to create a new crew."

settings:
  rows: 5
  title: "&rCrew Settings"
  requests:
    slot: 21
    enabled-material: LIME_DYE
    disabled-material: RED_DYE
    name: "&#e3262e&lJOIN REQUESTS"
    lore:
      - ""
      - "&fAllow players to send a request"
      - "&fto join your crew."
      - ""
      - "&#f4b52b&l| &fStatus: &#f4b52b%status%"
      - ""
      - "&#f4b52b→ &fClick to toggle."
  team-chat:
    slot: 23
    enabled-material: LIME_DYE
    disabled-material: RED_DYE
    name: "&#e3262e&lCREW CHAT"
    lore:
      - ""
      - "&fAllow crew members to chat privately"
      - "&fwith each other using &e/crew chat&f."
      - ""
      - "&#f4b52b&l| &fStatus: &#f4b52b%status%"
      - ""
      - "&#f4b52b→ &fClick to toggle."
