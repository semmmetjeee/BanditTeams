    material: BLACK_STAINED_GLASS_PANE
    name: " "
  back:
    slot-45: 40
    slot-54: 52
    material: ARROW
    name: "&#d9a441&l← GO BACK"
    lore:
      - "&7Return to the previous menu."
  navigation:
    previous:
      slot: 48
      material: ARROW
      name: "&#d9a441← Previous Page"
    page:
      slot: 49
      material: PAPER
      name: "&fPage &#d9a441%page%&f/&#d9a441%pages%"
    next:
      slot: 50
      material: ARROW
      name: "&#d9a441Next Page →"

members:
