# PlaceholderAPI
# %banditteams_name% - The player's crew name, or "No Team".

custom-command:
  # Set enabled to false to disable /crew and its aliases. /banditteams reload always stays available.
  enabled: true
  command: "crew"
  aliases: "crews"

invite-duration-seconds: 60
# Maximum number of members including the crew leader.
max-members: 10

messages:
  prefix: "&#d9a441&lCREW &8» &f"
  no-permission: "%prefix%&cYou do not have permission."
  player-only: "%prefix%&cOnly players can do this."
  usage: "%prefix%&7/crew create <name>, invite <player>, accept <player>, deny <player>, list, members, kick <player>, joinrequest <team>, acceptrequest <player>, settings, chat <message>, togglechat"
  invalid-name: "%prefix%&cCrew names must be 2 to 10 characters long and use only letters and numbers."
  name-taken: "%prefix%&cThat crew name is already taken."
  already-in-team: "%prefix%&cYou are already in a crew."
  created: "%prefix%&aYou created crew &#d9a441%team%&a."
  not-in-team: "%prefix%&cYou are not in a crew."
  leader-only: "%prefix%&cOnly the crew leader can do that."
  player-not-found: "%prefix%&cPlayer not found."
  target-in-team: "%prefix%&cThat player is already in a crew."
  team-full: "%prefix%&cYour crew is already full."
  join-requests-disabled: "%prefix%&cThis crew is not accepting join requests."
  join-request-sent: "%prefix%&aYour request was sent to crew &#d9a441%team%&a."
  join-request-received: "%prefix%&#d9a441%player% &frequested to join your crew. Use &#d9a441/crew acceptrequest %player% &fto accept."
  no-join-request: "%prefix%&cThat player has no active join request."
  request-accepted: "%prefix%&aYou accepted &#d9a441%player% &ainto the crew."
  request-denied: "%prefix%&7You denied the join request."
  team-chat-disabled: "%prefix%&cCrew chat is disabled for this crew."
  team-chat-toggled-on: "%prefix%&aCrew chat mode enabled. Your normal messages now go to your crew only."
  team-chat-toggled-off: "%prefix%&7Crew chat mode disabled. Your messages are public again."
  team-chat: "&#d9a441[CREW] &f%player%&8: &f%message%"
  create-chat: "%prefix%&eType your new crew name in chat. &7(2–10 characters, letters and numbers only)"
  settings-updated: "%prefix%&aCrew settings updated."
  invited: "%prefix%&aYou invited &#d9a441%player% &ato crew &#d9a441%team%&a."
  invite-received: "%prefix%&#d9a441%player% &finvited you to crew &#d9a441%team%&f. Type &#d9a441/crew accept %player% &fwithin %duration% seconds."
  invite-expired: "%prefix%&cThat invite has expired or does not exist."
  accepted: "%prefix%&aYou joined crew &#d9a441%team%&a."
  member-joined: "%prefix%&#d9a441%player% &ajoined the crew."
  denied: "%prefix%&7You declined the crew invite."
  kicked: "%prefix%&aYou kicked &#d9a441%player% &afrom the crew."
  kicked-target: "%prefix%&cYou were kicked from crew &#d9a441%team%&c."
  cannot-kick-leader: "%prefix%&cYou cannot kick the crew leader."
  reloaded: "%prefix%&aBanditTeams reloaded. Crew commands were refreshed."
  reload-usage: "%prefix%&7Use: &f/banditteams reload"
  friendly-fire: "&#d9a441&lCREW &8» &cYou cannot damage a crew member."
