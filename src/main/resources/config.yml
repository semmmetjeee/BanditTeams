# PlaceholderAPI
# %banditteams_name% - De naam van het team van de speler.

placeholders:
  # Output for %banditteams_name% when the player is not in a crew.
  default-name: "Geen team"

custom-command:
  # Zet uit om /crew en de aliassen uit te schakelen. /banditteams reload blijft beschikbaar.
  enabled: true
  command: "crew"
  aliases: "crews"

invite-duration-seconds: 60
# Maximaal aantal teamleden, inclusief de teamleider.
max-members: 10

messages:
  prefix: "&#d9a441&lBanditTeams &8» &f"
  no-permission: "%prefix%&cDaar heb je geen toestemming voor."
  player-only: "%prefix%&cDit commando kan alleen door spelers gebruikt worden."
  usage: "%prefix%&7Gebruik: &f/crew create <naam>, invite <speler>, accept <speler>, deny <speler>, list, members, kick <speler>, joinrequest <team>, acceptrequest <speler>, settings, chat <bericht>, togglechat, sethome, removehome, home, leave, disband, spy"
  invalid-name: "%prefix%&cEen teamnaam moet 2-10 tekens hebben en mag alleen letters en cijfers bevatten."
  name-taken: "%prefix%&cDie teamnaam bestaat al."
  already-in-team: "%prefix%&cJe zit al in een team."
  created: "%prefix%&aJe hebt team &#d9a441%team%&a aangemaakt."
  not-in-team: "%prefix%&cJe zit niet in een team."
  leader-only: "%prefix%&cAlleen de teamleider kan dit doen."
  player-not-found: "%prefix%&cSpeler niet gevonden."
  target-in-team: "%prefix%&cDie speler zit al in een team."
  team-full: "%prefix%&cJe team zit al vol."
  join-requests-disabled: "%prefix%&cDit team accepteert geen joinverzoeken."
  join-request-sent: "%prefix%&aJe verzoek om bij &#d9a441%team%&a te komen is verstuurd."
  join-request-received: "%prefix%&#d9a441%player% &fwil bij je team. Gebruik &#d9a441/crew acceptrequest %player% &fom het verzoek te accepteren."
  no-join-request: "%prefix%&cDeze speler heeft geen openstaand joinverzoek."
  request-accepted: "%prefix%&aJe hebt &#d9a441%player% &ftoegevoegd aan het team."
  request-denied: "%prefix%&7Je hebt het joinverzoek geweigerd."
  team-chat-disabled: "%prefix%&cTeamchat staat uit voor dit team."
  team-chat-toggled-on: "%prefix%&aTeamchat staat aan. Je berichten gaan nu alleen naar je team."
  team-chat-toggled-off: "%prefix%&7Teamchat staat uit. Je berichten zijn weer openbaar."
  team-chat: "&#d9a441&lTEAM &8» &f%player%&8: &f%message%"
  # Sent to players with banditteams.spy permission and to console. Placeholders: %team%, %player%, %message%.
  team-chat-spy: "&8[SPY] &#d9a441[%team%] &f%player%&8: &f%message%"
  team-chat-spy-enabled: "%prefix%&aJe kunt nu teamchat meelezen."
  team-chat-spy-disabled: "%prefix%&7Je kunt teamchat niet meer meelezen."
  create-chat: "%prefix%&7Vul de teamnaam in via het venster dat opent."
  invite-chat: "%prefix%&7Vul de spelersnaam in via het venster dat opent."
  settings-updated: "%prefix%&aTeaminstellingen opgeslagen."
  invited: "%prefix%&aJe hebt &#d9a441%player% &fuitgenodigd voor team &#d9a441%team%&a."
  invite-received: "%prefix%&#d9a441%player% &fheeft je uitgenodigd voor team &#d9a441%team%&f. Gebruik &#d9a441/crew accept %player% &fbinnen %duration% seconden."
  invite-expired: "%prefix%&cDeze uitnodiging is verlopen of bestaat niet."
  accepted: "%prefix%&aJe bent lid geworden van team &#d9a441%team%&a."
  member-joined: "%prefix%&#d9a441%player% &ais bij het team gekomen."
  denied: "%prefix%&7Je hebt de uitnodiging geweigerd."
  kicked: "%prefix%&aJe hebt &#d9a441%player% &fuit het team gezet."
  kicked-target: "%prefix%&cJe bent uit team &#d9a441%team% &cgezet."
  cannot-kick-leader: "%prefix%&cJe kunt de teamleider niet uit het team zetten."
  reloaded: "%prefix%&aBanditTeams is opnieuw geladen."
  reload-usage: "%prefix%&7Gebruik: &f/banditteams reload &7of &f/banditteams admin disband <team>"
  home-set: "%prefix%&aDe teambasis is ingesteld."
  home-removed: "%prefix%&aDe teambasis is verwijderd."
  home-not-set: "%prefix%&cJe team heeft nog geen basis ingesteld."
  home-teleported: "%prefix%&aJe bent naar de teambasis geteleporteerd."
  left-crew: "%prefix%&7Je hebt team &#d9a441%team% &7verlaten."
  member-left: "%prefix%&#d9a441%player% &7heeft het team verlaten."
  leader-cannot-leave: "%prefix%&cDe teamleider kan niet vertrekken. Gebruik &f/crew disband &com het team op te heffen."
  disband-confirmation: "%prefix%&cWeet je zeker dat je het team wilt opheffen? Voer het commando opnieuw uit om te bevestigen."
  disbanded: "%prefix%&aTeam &#d9a441%team% &ais opgeheven."
  disbanded-member: "%prefix%&cTeam &#d9a441%team% &cis opgeheven."
  admin-usage: "%prefix%&7Gebruik: &f/banditteams admin disband <team>"
  admin-disbanded: "%prefix%&aTeam &#d9a441%team% &ais opgeheven."
  crew-not-found: "%prefix%&cTeam niet gevonden."
  friendly-fire: "&#d9a441&lBanditTeams &8» &cJe kunt teamgenoten geen schade doen."
