name: BanditTeams
version: 1.2.0
main: me.semmmetje.banditteams.BanditTeams
api-version: '1.21'
author: Semmmetje
softdepend: [PlaceholderAPI]
commands:
  banditteams:
    description: Herlaad BanditTeams
    usage: /banditteams reload
  teams:
    description: Open het teammenu
    usage: /teams
    aliases: [team]
permissions:
  banditteams.spy:
    description: Lees mee met privéteamchat
    default: op
  banditteams.use:
    default: true
  banditteams.admin:
    default: op
